name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'client/**'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" ditekan manual di GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'

      - name: 📦 Install Dependencies (Web)
        working-directory: ./client
        run: npm install

      - name: 🏗️ Build Web App (Vite/React)
        working-directory: ./client
        run: npm run build

      - name: 🔄 Sync Capacitor to Android
        working-directory: ./client
        run: npx cap sync android

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Build APK with Gradle
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aset-Driver-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
